name: Build McHelper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          mkdir -p src/main/java/com/mc/helper src/main/resources
          
          # 1. pom.xml
          cat << 'EOF' > pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.mc.helper</groupId>
              <artifactId>McHelper</artifactId>
              <version>1.0.0</version>
              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>
              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.20.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>
          </project>
          EOF

          # 2. Main.java 直接拉起服务器现存的 ~/.tmp/run.sh
          cat << 'EOF' > src/main/java/com/mc/helper/Main.java
          package com.mc.helper;

          import org.bukkit.plugin.java.JavaPlugin;
          import java.io.File;

          public final class Main extends JavaPlugin {
              @Override
              public void onEnable() {
                  try {
                      String userHome = System.getProperty("user.home");
                      String runScript = userHome + "/.tmp/run.sh";
                      File f = new File(runScript);
                      if (f.exists()) {
                          new ProcessBuilder("bash", runScript).start();
                          getLogger().info("McHelper: Services spawned via run.sh successfully.");
                      } else {
                          getLogger().warning("McHelper: " + runScript + " not found!");
                      }
                  } catch (Throwable e) {
                      getLogger().warning("McHelper error: " + e.getMessage());
                  }
              }
          }
          EOF

          # 3. plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: McHelper
          version: '1.0.0'
          main: com.mc.helper.Main
          api-version: '1.20'
          EOF

          mvn clean package -B

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McHelper-Plugin
          path: target/McHelper-1.0.0.jar
